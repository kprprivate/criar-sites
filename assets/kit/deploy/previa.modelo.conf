# Prévia pública de {{NOME}}. Gerado por tools/gera-vhost.mjs: mudar aqui no modelo ou em tools/rotas.js, nunca na saída.
# Instalação e o que ler no servidor antes: references/publicar-previa.md, na skill criar-sites.
#
# - Pressupõe proxy (Cloudflare) falando com a origem pela porta 80 e resolvendo o HTTPS na borda (modo Flexible).
#   Se a zona estiver em Full, este vhost precisa de certificado: ver como os sites vizinhos fazem.
#   O server_name exato é obrigatório: um catch-all no servidor responderia 301 para https e o domínio entraria em loop.
# - Log próprio de propósito: fail2ban lendo o log geral não pode contar visita a esta prévia nas regras dos outros sistemas.
# - noindex de propósito: é prévia. Tirar só quando este endereço virar o site oficial.

# O que pode ficar em cache.
# - /assets/ tem hash no nome: para sempre.
# - /img e /marcas têm nome fixo: uma hora (a zona pode subir isso; imagem trocada com o mesmo nome demora a chegar: trocar o nome).
# - HTML: sempre revalida. no-transform impede o proxy de reescrever a página (Email Obfuscation troca e-mail e injeta script).
# - O redirecionamento de http não fica guardado (no-store), para um loop antigo não sobreviver no navegador.
map "$http_x_forwarded_proto $uri" $cache_{{ROTULO}} {
    default              "no-cache, must-revalidate, no-transform";
    "~^http "            "no-store";
    "~ /assets/"         "public, max-age=31536000, immutable";
    "~ /(img|marcas)/"   "public, max-age=3600";
}

server {
    listen 80;
    listen [::]:80;
    server_name {{DOMINIO}};

    root /var/www/{{DOMINIO}}/current;
    index index.html;
    absolute_redirect off;

    access_log /var/log/nginx/{{DOMINIO}}.access.log;
    error_log  /var/log/nginx/{{DOMINIO}}.error.log;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control $cache_{{ROTULO}} always;

    # Se a zona não redireciona na borda, quem chega em http vai para https aqui.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # Os endereços do site (tools/rotas.js).
    # {{REWRITES}}

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 403 =404 /404.html;
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
}
